trigger:
  - main

variables:
  # Azure DevOps → Azure service connection
  azureSubscription: 'AZ-CSP-DevOps'

  # Azure Container Registry
  containerRegistry: 'csptracker45.azurecr.io'
  acrName: 'CspTracker45'
  imageRepository: 'zeit-csp-tracker'

  # Docker
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

  # Build agent
  vmImageName: 'ubuntu-latest'

  # Azure App Service
  appName: 'csp-tracker'

stages:

# ==========================================================
# STAGE 1 - BUILD AND PUSH DOCKER IMAGE
# ==========================================================
- stage: Build
  displayName: 'Build and Push Docker Image'

  jobs:
    - job: BuildAndPush
      displayName: 'Build and Push to ACR'

      pool:
        vmImage: $(vmImageName)

      steps:

        - checkout: self

        - task: AzureCLI@2
          displayName: 'Login, Build and Push Docker Image'
          inputs:
            azureSubscription: '$(azureSubscription)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              set -e

              IMAGE_TAG="$(Build.BuildId)"
              FULL_IMAGE="$(containerRegistry)/$(imageRepository)"

              echo "Logging in to Azure..."
              az account show

              echo "Logging in to Azure Container Registry..."
              az acr login --name "$(acrName)"

              echo "Building Docker image..."
              docker build \
                -f "$(dockerfilePath)" \
                -t "${FULL_IMAGE}:${IMAGE_TAG}" \
                -t "${FULL_IMAGE}:latest" \
                "$(Build.SourcesDirectory)"

              echo "Pushing versioned image..."
              docker push "${FULL_IMAGE}:${IMAGE_TAG}"

              echo "Pushing latest image..."
              docker push "${FULL_IMAGE}:latest"

              echo "Docker image build and push completed successfully."

# ==========================================================
# STAGE 2 - DEPLOY CONTAINER TO AZURE APP SERVICE
# ==========================================================
- stage: Deploy
  displayName: 'Deploy Container to Azure App Service'

  dependsOn: Build

  condition: succeeded()

  jobs:
    - job: Deploy
      displayName: 'Deploy Docker Container'

      pool:
        vmImage: $(vmImageName)

      steps:

        - task: AzureWebAppContainer@1
          displayName: 'Deploy Image to App Service'
          inputs:
            azureSubscription: '$(azureSubscription)'
            appName: '$(appName)'
            containers: '$(containerRegistry)/$(imageRepository):$(Build.BuildId)'