services:
  web:
    build: .
    container_name: zeit-csp-web
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zeit_csp
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: zeit-csp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zeit_csp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: